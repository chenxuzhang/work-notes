<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="viteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bd34fe" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#41d1ff" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffea79" />
      <stop offset="100%" stop-color="#ff9800" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 外层多边形徽章 -->
  <polygon points="160,20 290,95 290,225 160,300 30,225 30,95" fill="url(#viteGrad)" filter="url(#glow)" opacity="0.95" />
  
  <!-- 内嵌深色切割层 -->
  <polygon points="160,38 274,104 274,216 160,282 46,216 46,104" fill="#18181b" opacity="0.88" />

  <!-- 极速闪电核心 -->
  <polygon points="175,60 100,170 155,170 145,260 220,150 165,150" fill="url(#boltGrad)" />
</svg>
